services:
  demo:
    image: o1brain-expanded:run-20261107
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      AI05_ENV: public
      AI05_DATABASE_URL: sqlite:////data/demo.db
      AI05_HMAC_KEYSTORE_PATH: /data/device_keys.json
    ports:
      - "127.0.0.1:18084:8080"
    volumes:
      - ${AI05_DATA_DIR:-./data}:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1
    pids_limit: 64
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
