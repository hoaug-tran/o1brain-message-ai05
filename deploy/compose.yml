services:
  community:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      O1BRAIN_TRUST_CLOUDFLARE: "0"
    restart: unless-stopped
    ports:
      - "127.0.0.1:18085:8080"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1
    pids_limit: 64
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  demo:
    image: o1brain-community-community
    restart: unless-stopped
    command: ["sh", "-c", "python -m alembic upgrade head && exec python -m uvicorn ai05.interfaces.http:app --host 0.0.0.0 --port 8080 --workers 1 --no-access-log --no-proxy-headers --limit-concurrency 32"]
    environment:
      AI05_ENV: public
      AI05_DATABASE_URL: sqlite:////data/demo.db
    ports:
      - "127.0.0.1:18084:8080"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1
    pids_limit: 64
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
