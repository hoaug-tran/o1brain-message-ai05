[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "o1brain-message"
version = "0.1.0"
description = "O(1).Brain local messaging and independent AI05 English SMS evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "scikit-learn>=1.6,<2", "pandas>=2.2,<3", "numpy>=2,<3",
  "joblib>=1.4,<2", "jinja2>=3.1,<4", "sqlalchemy>=2,<3", "alembic>=1.14,<2",
  "matplotlib>=3.10,<4", "wordcloud>=1.9.4,<2",
]

[dependency-groups]
dev = [
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "pandas-stubs>=2.2,<3",
    "pip-audit>=2.8,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai05", "ml"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["vendor", "results", ".task", "offline-demo"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "matplotlib.*", "scipy.*", "wordcloud.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
